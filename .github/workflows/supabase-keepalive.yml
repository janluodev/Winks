name: Supabase Keepalive

# Free-tier Supabase projects can pause when the previous week has too few
# user database requests. Query PostgREST three times per day so every run
# performs real, non-mutating database work.

on:
  schedule:
    # 09:23, 17:23 and 01:23 Singapore time; avoid GitHub's hourly peak.
    - cron: '23 1,9,17 * * *'
  workflow_dispatch:

# Least privilege: this workflow only makes an outbound curl and needs no GITHUB_TOKEN scopes.
permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repo secrets VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          base_url=${SUPABASE_URL%/}

          if ! http_code=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 90 \
            --output "$response_file" --write-out "%{http_code}" \
            "$base_url/rest/v1/links?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Accept: application/json" \
            -H "Cache-Control: no-cache"); then
            echo "::error::Supabase endpoint is unreachable. If the project is paused, resume it in the Dashboard before rerunning this workflow."
            exit 1
          fi

          echo "HTTP $http_code"
          if [ "$http_code" != "200" ]; then
            echo "::error::Keepalive query failed (HTTP $http_code)"
            cat "$response_file" || true
            exit 1
          fi
          if ! jq -e 'type == "array"' "$response_file" >/dev/null; then
            echo "::error::Supabase returned an unexpected response"
            cat "$response_file" || true
            exit 1
          fi

          echo "Supabase database query completed"
